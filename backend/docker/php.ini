memory_limit=256M
upload_max_filesize=20M
post_max_size=20M
; ML-158 : le serveur raisonne en UTC. Les colonnes datetime sont en
; TIMESTAMP WITH TIME ZONE, donc la persistance ne dépend plus de ce réglage ;
; il gouverne en revanche le fuseau des instants créés par `new
; \DateTimeImmutable()`. UTC les rend non ambigus, notamment autour des
; changements d'heure. La conversion vers l'heure de Paris se fait à
; l'affichage — voir templates/export/journal_pdf.html.twig.
date.timezone=UTC

opcache.enable=1
opcache.validate_timestamps=1
opcache.max_accelerated_files=20000
opcache.memory_consumption=128
