name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  check-changelog:
    name: Vérifie le CHANGELOG
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      - name: CHANGELOG.md doit être mis à jour (ML-32)
        run: |
          changed_files=$(git diff --name-only HEAD^ HEAD)
          non_dep_files=$(echo "$changed_files" | grep -vE '(^|/)(package(-lock)?\.json|composer\.(json|lock))$' || true)
          if [ -z "$non_dep_files" ]; then
            echo "Seuls des fichiers de dépendances ont changé, CHANGELOG.md non requis."
            exit 0
          fi
          if ! echo "$changed_files" | grep -qx 'CHANGELOG.md'; then
            echo "::error::CHANGELOG.md n'a pas été mis à jour par ce merge sur main. Ajoute une entrée avant de déployer."
            exit 1
          fi

  build-and-push:
    name: Build & push image
    needs: check-changelog
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Compute image name
        id: image
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          sha=${{ github.event.workflow_run.head_sha }}
          echo "owner=${owner}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${owner}/medlink-backend:${sha}" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: backend
          target: prod
          push: true
          tags: |
            ${{ steps.image.outputs.image }}
            ghcr.io/${{ steps.image.outputs.owner }}/medlink-backend:latest

  deploy-frontend:
    name: Build & deploy frontend web
    needs: check-changelog
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install & build
        working-directory: frontend-web
        run: |
          npm ci
          npm run build

      - name: Upload build to server (staging dir)
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "frontend-web/dist/*"
          target: "${{ secrets.DEPLOY_PATH }}/frontend/dist_new"
          strip_components: 2

      - name: Atomically swap build into place
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}/frontend
            mkdir -p downloads
            rm -rf dist_old
            [ -d dist ] && mv dist dist_old || true
            mv dist_new dist
            ln -sfn ../downloads dist/downloads
            rm -rf dist_old

  deploy:
    name: Deploy to production
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Upload docker-compose.prod.yml to server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "docker-compose.prod.yml"
          target: "${{ secrets.DEPLOY_PATH }}"

      - name: Deploy new image over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            docker inspect --format='{{.Config.Image}}' medlink_app > .previous_image 2>/dev/null || echo "" > .previous_image
            export BACKEND_IMAGE="${{ needs.build-and-push.outputs.image }}"
            export MAILER_DSN="${{ secrets.MAILER_DSN }}"
            docker compose -f docker-compose.prod.yml pull app
            docker compose -f docker-compose.prod.yml up -d --wait

      - name: Run pending Doctrine migrations
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            export BACKEND_IMAGE="${{ needs.build-and-push.outputs.image }}"
            export MAILER_DSN="${{ secrets.MAILER_DSN }}"
            docker compose -f docker-compose.prod.yml exec -T app php bin/console doctrine:migrations:current --no-interaction > .previous_migration_version 2>/dev/null || echo "none" > .previous_migration_version
            docker compose -f docker-compose.prod.yml exec -T app php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration

      - name: Healthcheck
        run: |
          curl --fail --silent --show-error --retry 6 --retry-delay 5 --retry-all-errors "${{ secrets.HEALTHCHECK_URL }}"

      - name: Rollback on failure
        if: failure()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            previous=$(cat .previous_image)
            if [ -n "$previous" ]; then
              export BACKEND_IMAGE="${previous}"
              export MAILER_DSN="${{ secrets.MAILER_DSN }}"
              docker compose -f docker-compose.prod.yml up -d --wait
              echo "Rolled back to ${previous}"
              # ML-150 : la migration DB, elle, n'est jamais annulée automatiquement
              # (un downgrade de schéma est trop risqué pour être automatisé) — on
              # se contente de signaler si le schéma est resté en avance sur
              # l'image redéployée, pour qu'une vérification manuelle soit faite.
              previous_migration=$(cat .previous_migration_version 2>/dev/null || echo "unknown")
              current_migration=$(docker compose -f docker-compose.prod.yml exec -T app php bin/console doctrine:migrations:current --no-interaction 2>/dev/null || echo "unknown")
              if [ "$current_migration" != "$previous_migration" ]; then
                echo "::warning::Une migration a été appliquée avant l'échec du déploiement (avant: ${previous_migration}, actuel: ${current_migration}). Le schéma de base de données est en avance sur l'image redéployée — vérifier manuellement la compatibilité avant de considérer le rollback comme sûr."
              fi
            else
              echo "No previous image recorded, manual intervention required" >&2
              exit 1
            fi

  # ML-169 : la planification de la sauvegarde quotidienne était posée à la main
  # sur le serveur — et n'y était plus. Elle est désormais réappliquée à chaque
  # déploiement, ce qui la rend indéracinable : une réinstallation du serveur,
  # un `systemctl disable` malencontreux ou une modification locale des unités
  # sont rattrapés au merge suivant sur main.
  #
  # Job séparé et non étape du job `deploy` : une planification qui échoue à
  # s'installer ne doit pas déclencher le rollback d'un déploiement applicatif
  # par ailleurs sain. Elle doit se voir (job rouge), pas casser la prod.
  schedule-backup:
    name: Réapplique la planification de sauvegarde
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Upload backup scheduling assets to server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "deploy/backup.sh,deploy/install-backup.sh,deploy/check-backup.sh,deploy/systemd/medlink-backup.service,deploy/systemd/medlink-backup.timer"
          target: "${{ secrets.DEPLOY_PATH }}"

      - name: Reinstall systemd timer
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}

            # scp ne garantit pas le report du bit exécutable : on le repose.
            # install-backup.sh est de toute façon invoqué via bash ci-dessous,
            # mais check-backup.sh, lui, sera lancé à la main plus tard.
            chmod +x deploy/*.sh

            # ML-169, correctif : cette étape testait d'abord `sudo -n true`
            # pour produire un message clair en l'absence de règle sudoers.
            # C'était faux. La règle recommandée n'autorise QUE le script
            # d'installation ; `true` n'est couvert par aucune règle NOPASSWD,
            # donc sudo réclamait un mot de passe et `-n` échouait — même avec
            # une règle parfaitement correcte. La sonde rendait le job
            # systématiquement rouge, c'est-à-dire qu'elle cassait exactement ce
            # qu'elle prétendait rendre lisible.
            #
            # On exécute donc directement la vraie commande. `sudo -n` (non
            # interactif) reste indispensable : sans lui, une session SSH sans
            # règle sudoers attendrait un mot de passe jusqu'au timeout du job.
            # Le message de sudo lui-même (« a password is required ») s'affiche
            # juste au-dessus du nôtre et distingue les deux causes possibles.
            #
            # Chemin absolu : c'est la forme exacte que la règle sudoers
            # autorise. Un chemin relatif ne correspondrait à aucune règle et
            # serait refusé.
            if ! sudo -n /bin/bash ${{ secrets.DEPLOY_PATH }}/deploy/install-backup.sh; then
              echo "::error::Réinstallation de la planification de sauvegarde en échec. Si le message ci-dessus mentionne un mot de passe sudo, la règle /etc/sudoers.d/medlink-backup est absente ou ne vise pas l'utilisateur de déploiement (voir deploy/backup.md). Sinon, c'est install-backup.sh qui a refusé d'installer : son motif est dans sa propre sortie."
              exit 1
            fi
