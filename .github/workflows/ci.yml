name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    # ML-164 : les motifs de branche de GitHub Actions sont sensibles à la
    # casse. L'ancien filtre "epic*" ne correspondait pas à la branche réelle
    # EPIC-21--evolutions-potentielles-corrections, si bien qu'aucune PR vers
    # une branche d'epic ne déclenchait la CI — silencieusement, le ruleset
    # correspondant souffrant de la même erreur de casse et n'exigeant donc
    # aucun check. Classe de caractères plutôt que "epic*"/"EPIC*" pour couvrir
    # aussi les casses mixtes (Epic-22, ePic-23...) : c'est une faute de frappe
    # à la création d'une branche qui a causé ce défaut, la tolérer coûte moins
    # cher que de le revivre.
    branches: [main, develop, "[Ee][Pp][Ii][Cc]*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: medlink_test
          POSTGRES_USER: medlink
          POSTGRES_PASSWORD: changeme
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medlink -d medlink_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: test
      DATABASE_URL: "postgresql://medlink:changeme@127.0.0.1:5432/medlink_test?serverVersion=16&charset=utf8"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: ctype, iconv, intl, pdo_pgsql, opcache, zip
          coverage: pcov
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: PHP CS Fixer (dry-run)
        run: vendor/bin/php-cs-fixer fix --dry-run --diff --config=.php-cs-fixer.dist.php

      - name: Warm up container for PHPStan
        run: php bin/console cache:warmup --env=dev

      - name: PHPStan (level 6)
        run: vendor/bin/phpstan analyse --configuration=phpstan.dist.neon --no-progress

      - name: PHPUnit (avec couverture)
        run: vendor/bin/phpunit --configuration=phpunit.dist.xml --coverage-text --colors=never

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: backend
          target: prod
          push: false
          tags: medlink-backend:ci

  frontend-web:
    name: Frontend web checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-web

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint (oxlint)
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

      - name: npm audit
        run: npm audit --audit-level=high

      # ML-163 : placé après le lint et avant le build. Un test qui échoue doit
      # arrêter le job avant qu'on ne dépense le temps de construction, et rien
      # ne rend cette étape non bloquante — c'est tout l'intérêt.
      - name: Tests unitaires (Vitest)
        run: npm test

      - name: Build
        run: npm run build

  frontend-mobile:
    name: Frontend mobile checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      # ML-171 : seul contrôle qui signale qu'un paquet ne correspond pas au
      # SDK Expo installé. Son absence est ce qui a laissé passer les PR #235
      # et #252, vertes de bout en bout — `expo export` ne rattrape pas,
      # ML-160 ayant établi qu'un bundle réussit même sur une application
      # cassée au runtime. Étape bloquante, et placée avant les tests et le
      # build : un désalignement SDK invalide tout ce qui suit.
      #
      # Script maison plutôt que `npx expo-doctor` : expo-doctor exige la
      # toute dernière version publiée pour chaque paquet du SDK, ce qui
      # échoue dès qu'Expo publie un correctif que le projet n'a pas encore
      # absorbé — sans qu'aucun auteur de PR n'en soit responsable. Constaté
      # le 21/09/2026 sur ce projet, pourtant aligné. Un check requis ne doit
      # échouer que pour une raison que l'auteur de la PR contrôle. Le détail
      # de la politique appliquée est documenté en tête du script.
      #
      # expo-doctor garde toute sa valeur pour ses 20 autres contrôles, en
      # hebdomadaire et non bloquant : voir expo-doctor.yml.
      - name: Alignement SDK (paquets gérés par Expo)
        run: node scripts/check-sdk-alignment.mjs

      - name: ESLint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

      - name: npm audit
        run: npm audit --audit-level=high

      - name: Tests unitaires (Jest)
        run: npm run test:ci

      - name: Build (export)
        run: npm run build
