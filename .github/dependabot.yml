version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/backend"
    schedule:
      interval: "weekly"
    target-branch: "develop"
    groups:
      backend-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/frontend-web"
    schedule:
      interval: "weekly"
    target-branch: "develop"
    groups:
      frontend-web-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/frontend-mobile"
    schedule:
      interval: "weekly"
    target-branch: "develop"
    groups:
      frontend-mobile-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # ML-171 : POLITIQUE D'ALIGNEMENT SUR LE SDK EXPO.
      #
      # Les paquets ci-dessous sont listés dans le `bundledNativeModules.json`
      # du SDK Expo : c'est le SDK qui décide de leur version, pas Dependabot.
      # Laisser proposer au-delà de cet épinglage reproduit le mode de
      # défaillance de ML-153 et ML-154 — paquet de l'écosystème Expo résolu
      # au-dessus du SDK du projet, build Android cassé puis crash au
      # lancement. Constaté deux fois en une semaine (PR #235 le 14/09, PR #252
      # le 20/09), la dérive s'aggravant à chaque passage.
      #
      # La borne est calée sur le MINEUR SUIVANT et non sur le patch suivant :
      # un patch à l'intérieur de la plage du SDK reste proposé, ce qui laisse
      # arriver les correctifs de sécurité. Les conditions d'ignore de
      # Dependabot s'appliquant aussi aux mises à jour de sécurité, un ignore
      # total masquerait une faille sur react-native ou @sentry/react-native —
      # inacceptable sur une application manipulant des données de santé.
      #
      # À CHAQUE MONTÉE DE SDK, ces bornes se recalent. La commande qui les
      # régénère est dans frontend-mobile/README-sdk.md ; ne pas les corriger
      # une par une à la main.
      #
      # NE PAS ajouter ici : `expo` lui-même (c'est le SDK, ses patches 57.x
      # sont souhaitables), `@react-navigation/*`, `axios`,
      # `react-native-keyboard-aware-scroll-view` — aucun n'est piloté par le
      # SDK, ils doivent continuer d'être suivis normalement.
      - dependency-name: "@react-native-community/datetimepicker"
        versions: [">=9.2.0"] # SDK 57 : 9.1.0
      - dependency-name: "@sentry/react-native"
        versions: [">=7.12.0"] # SDK 57 : ~7.11.0
      - dependency-name: "eslint-config-expo"
        versions: [">=57.1.0"] # SDK 57 : ~57.0.2
      - dependency-name: "expo-constants"
        versions: [">=57.1.0"] # SDK 57 : ~57.0.18
      - dependency-name: "expo-file-system"
        versions: [">=57.1.0"] # SDK 57 : ~57.0.7
      - dependency-name: "expo-sharing"
        versions: [">=57.1.0"] # SDK 57 : ~57.0.19
      - dependency-name: "expo-status-bar"
        versions: [">=57.1.0"] # SDK 57 : ~57.0.1
      - dependency-name: "jest-expo"
        versions: [">=57.1.0"] # SDK 57 : ~57.0.5
      - dependency-name: "react"
        versions: [">=19.3.0"] # SDK 57 : 19.2.3
      - dependency-name: "react-native"
        versions: [">=0.87.0"] # SDK 57 : 0.86.3
      - dependency-name: "react-native-gesture-handler"
        versions: [">=2.33.0"] # SDK 57 : ~2.32.0
      - dependency-name: "react-native-safe-area-context"
        versions: [">=5.8.0"] # SDK 57 : ~5.7.0
      - dependency-name: "react-native-screens"
        versions: [">=4.27.0"] # SDK 57 : ~4.26.0

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "develop"
    groups:
      github-actions-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]