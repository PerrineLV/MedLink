version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/backend"
    schedule:
      interval: "weekly"
    target-branch: "develop"
    groups:
      backend-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/frontend-web"
    schedule:
      interval: "weekly"
    target-branch: "develop"
    groups:
      frontend-web-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/frontend-mobile"
    schedule:
      interval: "weekly"
    target-branch: "develop"
    groups:
      frontend-mobile-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # ML-149 : react-native est en versioning 0.x, donc un bump 0.81 -> 0.86
      # est classé "semver-minor" par Dependabot (pas "semver-major"), et
      # échappe donc à la règle générique ci-dessus. Dans les faits ce type de
      # saut équivaut à un bump majeur pour cet écosystème (breaking changes
      # fréquents, dépendance stricte à la version Expo SDK — SDK 54 attend
      # react-native ~0.81.x). Plage à relever manuellement quand on bump
      # Expo SDK et qu'on veut rouvrir la fenêtre react-native.
      - dependency-name: "react-native"
        versions: [">=0.82.0"]
      # ML-149 : autre dépendance 0.x du monorepo identifiée à cette
      # vérification, react-native-keyboard-aware-scroll-view (0.9.x) n'a
      # pas de plage d'ignore dédiée : contrairement à react-native, elle
      # n'est pas couplée à une contrainte externe stricte type Expo SDK et
      # n'a pas eu de bump depuis longtemps. Backend (composer) et
      # frontend-web n'ont aucune dépendance en versioning 0.x.
      # PR #194 (groupe frontend-mobile-minor-patch) : react-native-screens
      # 4.16.0 -> 4.27.0 casse "expo export" (Metro), reproduit en isolant ce
      # seul paquet du groupe : SyntaxError sur
      # node_modules/react-native-screens/src/fabric/SearchBarNativeComponent.ts
      # ("React.ElementRef<> doit avoir un argument de type" — syntaxe Flow
      # valide côté react-native-screens, invalide pour le parseur TS de
      # Metro tel que figé sur Expo SDK 54). Contrairement à react-native
      # (ML-149), ce n'est pas un artefact de versioning 0.x : un bump
      # mineur légitime de react-native-screens s'est simplement avéré
      # incompatible avec la chaîne d'outils figée sur SDK 54. Versions à
      # partir de 4.17.0 ignorées par précaution (seule 4.27.0 testée et
      # confirmée cassée) ; plage à relever manuellement quand on bump Expo
      # SDK, comme pour react-native.
      - dependency-name: "react-native-screens"
        versions: [">=4.17.0"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "develop"
    groups:
      github-actions-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]